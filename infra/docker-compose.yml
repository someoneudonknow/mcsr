include:
  - ./kafka/docker-compose.yml
  - ./rustfs/docker-compose.yml

services:
  postgres:
    image: postgres:18-alpine
    container_name: mcsr_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mcsr}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:Z
    networks:
      - mcsr-backend

  redis:
    image: redis:7-alpine
    container_name: mcsr_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:Z
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - mcsr-backend

  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: mcsr_etcd
    restart: unless-stopped
    environment:
      - ETCD_NAME=etcd-1
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_DATA_DIR=/var/lib/etcd
    volumes:
      - etcd_data:/var/lib/etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - mcsr-backend

  apisix:
    image: apache/apisix:latest
    container_name: mcsr_apisix
    restart: unless-stopped
    environment:
      - APISIX_NODE_LISTEN=9080
      - APISIX_CONTROL_PORT=9092
      - APISIX_ADMIN_LISTEN=9180
      - APISIX_ADMIN_KEY=yZJEDYlmxypYIKLb2FPmDCBOZZJGzrwQ
    volumes:
      - ./apisix/conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro,Z
      - ./apisix/plugins/rsa-auth:/usr/local/apisix/apisix/plugins/rsa-auth:ro,Z
    ports:
      - "9080:9080"
      - "9443:9443"
      - "9180:9180"
    depends_on:
      - etcd
    networks:
      - mcsr-backend

volumes:
  postgres_data:
  redis_data:
  etcd_data:

networks:
  mcsr-backend:
  mcsr-frontend:
