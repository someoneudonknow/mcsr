server:
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  api_prefix: /api

cors:
  allow_origins:
    - "http://localhost:3000"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Accept"
    - "Content-Type"
    - "Authorization"
    - "X-Request-Id"
  expose_headers:
    - "X-Request-Id"
  allow_credentials: true
  max_age: 3600

database:
  type: postgres
  # host: ""
  # port: ""
  # user: ""
  # password: ""
  dbname: spatial-service
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

redis:
  # addr: ""
  # user: ""
  # password: ""
  db: 0
  pool_size: 50
  min_idle_conns: 20
  dial_timeout: 5s
  read_timeout: 2s
  write_timeout: 2s
  pool_timeout: 5s
  max_retries: 3
  tls_enabled: false

logger:
  level: debug
  filename: /logs/app.log
  max_size: 500
  max_backups: 10
  compress: true
  max_age: 30
